<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A-aniame | Hiaki Coloring App</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">

<div class="upper-outer-box">
     <div class="upper-inner-box">
        <section class="tools-board">
            
            <div class="row">
                <label class="title">Ka nananam</label>
                <ul class="options">
                    <li class="option tool" id="rectangle">
                        <img src="icons/rectangle.svg" style="width: 20px; height: 20px;" alt="Rectangle">
                        <audio id="audio" audiostart="false" src="media/audio.m4a"></audio>
                        <button onclick="clickRectangle();"><span>Woi katana teeve</span></button>
                    </li>
                    <li class="option tool" id="circle">
                        <img src="icons/circle.svg" alt="circle">
                        <span>Koelai</span>
                    </li>
                    <li class="option tool" id="triangle">
                        <img src="icons/triangle.svg" alt="triangle">
                        <span>Vahi chakariakame</span>
                    </li>
                    <li class="option">
                        <input type="checkbox" id="fill-color">
                        <label for="fill-color">Fill color</label>
                    </li>
                </ul>
            </div>

            <div class="row">
                <label class="title">Options</label>
                <ul class="options">
                    <li class="option active tool" id="brush">
                        <img src="icons/brush.svg" alt="brush">
                        <span>Brush</span>
                    </li>
                    <li class="option tool" id="eraser">
                        <img src="icons/eraser.svg" alt="eraser">
                        <span>Eraser</span>
                    </li>
                    <li class="option">
                        <input type="range" id="size-slider">
                    </li>
                </ul>
            </div>

            <div class="row colors">
                <label class="title">Hiyokim</label>
                <ul class="options">
                    <li class="option">
                        <p class="text">Tosai</p>
                    </li>
                    <li class="option selected">
                        <audio id="audio2" audiostart="false" src="media/black.m4a"></audio>
                        <button onclick="clickBlack();"><span class="text">Chukui</span></button>
                    </li>
                    <li class="option">
                        <p class="text">Siki</p>
                    </li>
                    <li class="option">
                        <p class="text">Sawa_hewei</p>
                    </li>
                    <li class="option">
                        <p class="text">Sawai</p>
                    </li>
                    <li class="option">
                        <p class="text">Siari</p>
                    </li>
                    <li class="option">
                        <p class="text">Tewei</p>
                    </li>
                    <li class="option">
                        <p class="text">Kut_tewei</p>
                    </li>
                    <li class="option">
                        <p class="text">Sikheewi</p>
                    </li>
                    <li class="plus">
                        <input type="color" id="color-picker" value="#4A98F7">
                    </li>
                </ul>
            </div>

            <div class="row buttons">
                <button class="clear-canvas">Clear Canvas</button>
                <button class="save-img">Save As Image</button>
            </div>


        </section>
 </div>
</div>



<div class="lower-outer-box">
     <div class="lower-inner-box">
           <section class="drawing-board">
            <canvas></canvas>
        </section>
 </div>
</div>

    </div>
</body>
</html>
