<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A-aniame | Hiaki Coloring App</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">

<div class="upper-outer-box">
     <div class="upper-inner-box">
        <section class="tools-board">
            
            <div class="row">
                <div class="title" style="padding-left: 90px;">
                    <audio id="shapes" audiostart="false" src="media/shapes.m4a"></audio>
                    <button onclick="clickShapes();"><span>Ka nananam</span></button>
                </div>
                <ul class="options">

                    <li class="option tool" id="rectangle">
    <!-- I renamed "rect" b/c it didn't like the full word :( -->
                        <img src="icons/rectangle.svg" alt="Rectangle">
                        <audio id="rect" audiostart="false" src="media/rectangle.m4a"></audio>
                        <button onclick="clickRectangle();"><span>Woi katana teeve</span></button>
                    </li>

                    <li class="option tool" id="circle">
                        <img src="icons/circle.svg" alt="circle">
                        <audio id="circle" audiostart="false" src="media/circle.m4a"></audio>
                        <button onclick="clickCircle();"><span>Koelai</span></button>
                    </li>
                    <li class="option tool" id="triangle">
                        <img src="icons/triangle.svg" alt="triangle">
                        <audio id="triangle" audiostart="false" src="media/triangle.m4a"></audio>
                        <button onclick="clickTriangle();"><span>Vahi chakariakame</span></button>
                    </li>
                    <li class="option">
                        <input type="checkbox" id="fill-color">
                        <label for="fill-color">Fill color</label>
                    </li>
                </ul>
            </div>

            <div class="row">
                <div class="title">
                    <audio id="options" audiostart="false" src="media/options.m4a"></audio>
                    <button onclick="clickOptions();"><span>Options</span></button>
                </div>
                <ul class="options">
                    <li class="option active tool" id="brush">
                        <img src="icons/brush.svg" alt="brush">
                        <span>Brush</span>
                    </li>
                    <li class="option tool" id="eraser">
                        <img src="icons/eraser.svg" alt="eraser">
                        <span>Eraser</span>
                    </li>
                    <li class="option">
                        <input type="range" id="size-slider" min="1" max="30" value="5">
                    </li>
                </ul>
            </div>
<br>
            <div class="row colors">
                <div class="title">
                    <audio id="colors" audiostart="false" src="media/colors.m4a"></audio>
                    <button onclick="clickColors();"><span>Hiyokim</span></button>
                </div>
                <ul class="options">
                    <li class="option">
                        <audio id="white" audiostart="false" src="media/white.m4a"></audio>
                        <button onclick="clickWhite();"><span class="text">Tosai</span></button>
                    </li>
                    <li class="option selected">
                        <audio id="black" audiostart="false" src="media/black.m4a"></audio>
                        <button onclick="clickBlack();"><span class="text">Chukui</span></button>
                    </li>
                    <li class="option">
                        <audio id="red" audiostart="false" src="media/red.m4a"></audio>
                        <button onclick="clickRed();"><span class="text">Siki</span></button>
                    </li>
                    <li class="option">
                        <audio id="orange" audiostart="false" src="media/orange.m4a"></audio>
                        <button onclick="clickOrange();"><span class="text">Sawa_Hewei</span></button>
                    </li>
                    <li class="option">
                        <audio id="yellow" audiostart="false" src="media/yellow.m4a"></audio>
                        <button onclick="clickYellow();"><span class="text">Sawai</span></button>
                    </li>
                    <li class="option">
                        <audio id="green" audiostart="false" src="media/green.m4a"></audio>
                        <button onclick="clickGreen();"><span class="text">Siari</span></button>
                    </li>
                    <li class="option">
                        <audio id="blue" audiostart="false" src="media/blue.m4a"></audio>
                        <button onclick="clickBlue();"><span class="text">Tewei</span></button>
                    </li>
                    <li class="option">
                        <audio id="purple" audiostart="false" src="media/purple.m4a"></audio>
                        <button onclick="clickPurple();"><span class="text">Kut_tewei</span></button>
                    </li>
                    <li class="option">
                        <audio id="pink" audiostart="false" src="media/pink.m4a"></audio>
                        <button onclick="clickPink();"><span class="text">Sikheewi</span></button>
                    </li>

        <!-- This does work. Omitting for language purposes -->
                    <!-- <li class="option">
                        <input type="color" id="color-picker" value="#4A98F7">
                    </li> -->
                </ul>
            </div>

        </section>
 </div>
</div>



<div class="lower-outer-box">
     <div class="lower-inner-box">
           <section class="drawing-board">
            <canvas></canvas>
        </section>
 </div>
    <div class="row buttons">
                <button class="clear-canvas">Clear Canvas</button>
                <button class="save-img">Save As Image</button>
            </div>
</div>

    </div>
</body>
</html>
