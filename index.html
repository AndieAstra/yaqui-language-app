<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-aniame | Hiaki Coloring App</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <section class="tools-board">
            <div class="row">
                <label class="title">Shapes</label>
                <ul class="options">
                    <li class="option tool" id="rectangle">
                        <img src="icons/rectangle.svg" alt="Rectangle">
                        <span>Rectangle</span>
                    </li>
                    <li class="option tool" id="circle">
                        <img src="icons/circle.svg" alt="Circle">
                        <span>Circle</span>
                    </li>
                    <li class="option tool" id="triangle">
                        <img src="icons/triangle.svg" alt="Triangle">
                        <span>Triangle</span>
                    </li>
                    <li class="option tool" id="fill-color">
                        <input type="checkbox" id="fill-color">
                        <label for="fill-color">Fill color</label>
                    </li>
                </ul>
            </div>

            <div class="row">
                <label class="title">Options</label>
                <ul class="options">
                    <li class="option tool active" id="brush">
                        <img src="icons/brush.svg" alt="Brush">
                        <span>Brush</span>
                    </li>
                    <li class="option tool" id="eraser">
                        <img src="icons/eraser.svg" alt="Eraser">
                        <span>Eraser</span>
                    </li>
                    <li class="option tool" id="size-slider">
                        <input type="range" id="size-slider">
                    </li>
                </ul>
            </div>


            <div class="row colors">
                <label class="title">Colors</label>
                <ul class="options">
                    <li class="option">
                        <p class="text">white</p>
                    </li>
                    <li class="option">
                        <p class="text">black</p>
                    </li>
                    <li class="option selected">
                        <p class="text">red</p>
                    </li>
                    <li class="option">
                        <p class="text">orange</p>
                    </li>
                    <li class="option">
                        <p class="text">yellow</p>
                    </li>
                    <li class="option">
                        <p class="text">green</p>
                    </li>
                    <li class="option">
                        <p class="text">blue</p>
                    </li>
                    <li class="option">
                        <p class="text">purple</p>
                    </li>
                    <li class="option">
                        <p class="text">pink</p>
                    </li>
                    <li class="plus">
                        <input type="color" id="color-picker" value="#4A98F7">
                    </li>
                </ul>
            </div>

            <div class="row buttons">
                <button class="clear-canvas">Clear Canvas</button>
                <button class="save-img">Save As Image</button>
            </div>


        </section>

        <section class="drawing-board">
            <canvas></canvas>
        </section>

    </div>
</body>
</html>
